  langues_annonce: francais ou anglais

  redhibitoires:
    - salaire affiche avec fixe OU package inferieur a 43 000 EUR
    - deplacements hors IDF sur base hebdomadaire
    - poste 100 % anglophone
    - business avec clientele etrangere
    - presentiel 5j/5 sans aucun teletravail
    - astreintes, horaires decales ou travail le week-end
    - poste en ESN consistant a placer des consultants chez le client
      (Capgemini, Sopra Steria, Atos, Alten, Akkodis, Inetum et equivalents)

  non_redhibitoires:      # explicitement acceptes par Mehdi
    - temps de trajet (peu importe si le poste est bon)
    - statut non-cadre
    - clause de mobilite geographique
    - management d'equipe obligatoire
    - filiale plutot que maison mere
    # ESN retirees des non-redhibitoires le 15/09/2026 : voir redhibitoires

  teletravail:
    minimum: 1 jour
    ideal: 2 a 3 jours
    zero_jour: redhibitoire

  secteurs_exclus:
    - ESN / prestation intellectuelle en placement de consultants
