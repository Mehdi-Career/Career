# ------------------------------------------------------------
# JOURNAL DE CALIBRATION
# Chaque offre scoree manuellement et validee par Mehdi.
# Sert de reference pour verifier qu'une modif du prompt ne casse rien.
# ------------------------------------------------------------
calibration:
  - date: 2026-09-15
    offre: SUEZ IWS - Ingenieur Commercial H/F - Villeparisis (77)
    source: welcometothejungle.com
    match_brut: 52
    match_atteignable: 82
    verdict_mehdi: valide
    murs: aucun
    apprentissages:
      - >
        "Connaissance du secteur serait un plus" et "idealement dans un
        environnement industriel" ne sont PAS des murs. Un filtrage naif
        aurait elimine cette offre a tort.
      - >
        Angle industriel cache dans le profil : ENGIE Solutions + Enedis +
        Groupe ADP + SNCF + Keolis + Danone. A rejouer sur toute offre
        industrie, energie, environnement, infrastructure ou transport.
      - >
        Reprendre la graphie exacte de l'annonce (BtoB et non B2B).
        Les ATS matchent litteralement.
      - >
        Deplacements nombreux MAIS a l'interieur de l'IDF : pas redhibitoire.
        Le critere ne vise que les deplacements hors IDF hebdomadaires.
    couverture_mots_cles: 20/20
