langues:
  francais: langue maternelle
  anglais:
    affiche: professionnel
    reel: >
      Anglais professionnel, pas fluent. Echanges internes, reporting et
      collaboration avec des equipes etrangeres : sans probleme.
      Rendez-vous client, negociation ou poste 100 % anglophone : non.
    score_officiel: aucun

    # Critere a TROIS etats, pas binaire. Les annonces precisent rarement
    # si l'anglais est client ou interne : rejeter sur l'ambiguite couterait
    # trop d'offres correctes.
    classification:
      ok:
        description: anglais interne uniquement, aucune penalite
        signaux:
          - 'anglais professionnel / anglais operationnel / anglais lu et ecrit'
          - perimetre explicitement France ou Ile-de-France
          - annonce redigee en francais decrivant des clients francais
          - 'reporting en anglais'
          - 'echanges avec les equipes internationales'
          - siege etranger mais territoire commercial francais

      mur:
        description: anglais en clientele, eliminatoire
        signaux:
          - 'clientele internationale / comptes EMEA / international accounts'
          - 'negociation en anglais / presentation client en anglais'
          - titre contenant Global, International, EMEA, Worldwide
          - 'anglais courant imperatif / bilingue anglais / fluent English required'
          - perimetre commercial hors France
          - annonce integralement en anglais ET territoire EMEA ou Global

      a_verifier:
        description: >
          Ambigu. NE PAS rejeter. Scorer normalement et remonter l'offre
          avec le drapeau visible : Mehdi tranche en trois secondes.
        signaux:
          - 'French and English speaking sans precision du perimetre'
          - anglais mentionne sans contexte client ni interne
          - annonce en anglais mais territoire France

benevolat_associatif: aucun

# ------------------------------------------------------------
# REGLES D'ADAPTATION DU CV
# ------------------------------------------------------------
regles_adaptation:

  format:
    fichier_portail: .docx        # mieux parse par Workday, Taleo, SuccessFactors
    fichier_direct: .pdf
    pages: 2 (aucun impact ATS, la page 2 accueille les mots-cles de l'annonce)
    structure: une colonne, sans photo, sans icone, sans tableau,
               sans en-tete ni pied de page Word
    police: Calibri, noir, aligne a gauche
    metadonnees: auteur "Mehdi Koriche", jamais l'employeur actuel

  variables_par_offre:
    - titre en haut du CV
    - accroche du profil
    - ordre et formulation des bullets
    - methodologie de vente affichee
    - outils ajoutes depuis le reservoir
    - vocabulaire repris litteralement de l'annonce

  autorise:
    - reformuler, reordonner, requalifier ce qui a ete reellement fait
    - remonter une competence enterree
    - reprendre le vocabulaire exact de l'annonce
    - changer le vocabulaire de l'intitule a seniorite equivalente
      (Account Executive / Ingenieur commercial / Ingenieur d'affaires /
      Responsable de comptes = meme metier)

  interdit:
    - inventer une experience ou un outil jamais utilise
    - modifier la seniorite d'un poste (Engie reste SDR)
    - gonfler les durees (Comet = 15 mois, pas 2 ans)

  boucle_apprentissage: >
    Quand une annonce cite une competence ou un outil dont le niveau de Mehdi
    n'est pas connu, poser la question avant d'ecrire. La reponse est ecrite
    dans ce fichier de facon definitive. Au bout de 20-30 offres, les questions
    se rarefient.

# ------------------------------------------------------------
# SCORING
# ------------------------------------------------------------
scoring:
  principe: >
    La note ne mesure pas "est-ce que Mehdi correspond" mais
    "est-ce que Mehdi peut entrer, une fois le CV adapte".
  notes_produites: [match_brut, match_atteignable]
  drapeaux: [anglais_a_verifier, management_exige, seniorite_limite]
  filtrage_sur: match_atteignable
  seuil_declenchement: 55
  seuil_notification_push: 80
  grille:
    couverture_directe: 35
    couverture_atteignable: 30
    compatibilite_seniorite: 20
    fraicheur_annonce: 15
  murs:
    - nombre d'annees exige et verifiable
    - diplome impose non detenu
    - certification non detenue
    - habilitation
    - anglais en clientele
    - domaine metier technique (voir outils.jamais)
    - experience sectorielle reglementee (pharma GxP, conformite bancaire)
  calibrage_attendu: >
    Commercial grands comptes B2B est une famille tres publiee en IDF.
    Prevoir 15 a 25 offres par jour au-dessus de 55. Remonter le seuil
    apres les 50 premieres offres.

