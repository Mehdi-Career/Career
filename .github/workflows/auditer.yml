name: Auditer les sites

# Va chercher le code source de chaque site carrieres, identifie la
# plateforme, et ecrit un rapport que Claude lit directement.
# Plus aucun copier-coller manuel.

on:
  workflow_dispatch:
    inputs:
      perimetre:
        description: "toutes | inconnues"
        required: true
        default: 'toutes'

permissions:
  contents: write

jobs:
  auditer:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install requests

      - name: Audit
        run: |
          ARGS=""
          [ "${{ inputs.perimetre }}" = "inconnues" ] && ARGS="$ARGS --inconnues"
          [ -n "${{ inputs.limite }}" ] && ARGS="$ARGS --n ${{ inputs.limite }}"
          echo "python -u audit_sites.py $ARGS"
          python -u audit_sites.py $ARGS

      - name: Commit du rapport
        if: always()
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -f audit/
          if git diff --cached --quiet; then
            echo "Aucun changement."
          else
            git commit -m "Audit des sites $(date +%d/%m/%Y\ %H:%M)"
            git pull --rebase --autostash || true
            git push
          fi
