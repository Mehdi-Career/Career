name: Pipeline candidatures

on:
  schedule:
    - cron: '17 * * * *'   # minute 17 : les creneaux en debut d'heure sont satures
  workflow_dispatch:        # bouton pour lancer a la main

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - run: pip install -r requirements.txt

      - name: LibreOffice (conversion PDF)
        run: sudo apt-get update -qq && sudo apt-get install -y -qq libreoffice-writer

      # La base vit dans le cache : le repo est public, les donnees n'y sont pas.
      - name: Restaurer la base
        uses: actions/cache/restore@v4
        with:
          path: offres.db
          key: offres-db-${{ github.run_id }}
          restore-keys: offres-db-

      - name: Cycle
        env:
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          MAIL_ADRESSE:                ${{ secrets.MAIL_ADRESSE }}
          MAIL_MDP_APPLICATION:        ${{ secrets.MAIL_MDP_APPLICATION }}
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
          SHEET_ID:                    ${{ secrets.SHEET_ID }}
        run: python run.py

      - name: Sauvegarder la base
        if: always()
        uses: actions/cache/save@v4
        with:
          path: offres.db
          key: offres-db-${{ github.run_id }}
